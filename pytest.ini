[pytest]
# Nonaktifkan plugin pihak ketiga yang bermasalah di lingkungan ini
# (mis. libtmux memicu "Marks cannot be applied to fixtures" saat load).
addopts = -p no:libtmux
# Catatan: environment variable untuk konsistensi JWT secret & DB in-memory
# diset di conftest.py level root (dimuat sebelum modul cloudsim diimpor).
